services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: contact_db
    volumes:
      # Named volume -> lives on the Docker host, survives container
      # rebuilds/removals. This is where all product/order/user data lives.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/contact_db
    volumes:
      # Bind mount to the actual repo folder on the VPS, so uploaded
      # product images are never lost on rebuild/redeploy and are
      # easy to back up alongside the rest of the code checkout.
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      # Bind to localhost only - your host-level nginx routes to this
      # port, same pattern as your other client stacks. If this VPS
      # will ONLY ever run this one app with no host nginx in front,
      # change to "80:80" instead to publish it directly.
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
